name: Update Adobe Downloader Cask

on:
  schedule:
    - cron: "36 23 */3 * *" # 每月 1、4、7...号检查一次
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cask-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check new version
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/X1a0He/Adobe-Downloader/releases/latest"
          CURRENT_VERSION=$(sed -n 's/^  version \"\(.*\)\"/\1/p' Casks/adobe-downloader.rb)

          echo "::group::Checking for new version"
          echo "Current version: $CURRENT_VERSION"

          curl_headers=(-H "Accept: application/vnd.github+json")
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            curl_headers+=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          fi
          json=$(curl -fsSL "${curl_headers[@]}" "$API")
          TAG=$(printf "%s" "$json" | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)

          if [[ -z "${TAG:-}" ]]; then
            echo "::error::Failed to parse latest GitHub tag."
            exit 1
          fi

          echo "Latest tag: $TAG"

          if [[ "$TAG" == "$CURRENT_VERSION" ]]; then
            echo "::notice::Already at latest version: $CURRENT_VERSION"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::New version available: $TAG"
          echo "::endgroup::"

          URL="https://github.com/X1a0He/Adobe-Downloader/releases/download/${TAG}/Adobe.Downloader.dmg"

          echo "::group::Downloading file"
          echo "Downloading from: $URL"

          # 并行下载以提高性能
          mkdir -p /tmp/cask-downloads
          curl --retry 5 --retry-all-errors --retry-delay 2 -fSL "$URL" -o /tmp/cask-downloads/adobe-downloader.dmg

          # 验证下载的文件
          if [[ ! -f /tmp/cask-downloads/adobe-downloader.dmg ]]; then
            echo "::error::Download failed - file not found"
            exit 1
          fi

          # 检查文件大小
          FILE_SIZE=$(stat -c%s /tmp/cask-downloads/adobe-downloader.dmg 2>/dev/null || stat -f%z /tmp/cask-downloads/adobe-downloader.dmg 2>/dev/null || echo "0")

          if [[ "$FILE_SIZE" -lt 3000000 ]]; then
            echo "::error::Downloaded file is too small - possible corruption"
            exit 1
          fi

          echo "::notice::File downloaded successfully - ${FILE_SIZE} bytes"
          echo "::endgroup::"

          SHA=$(shasum -a 256 /tmp/cask-downloads/adobe-downloader.dmg | awk '{print $1}')

          echo "new_version=$TAG" >> "$GITHUB_OUTPUT"
          echo "new_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "update_needed=true" >> "$GITHUB_OUTPUT"
          echo "old_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      # 验证检查步骤的输出
      - name: Validate check outputs
        if: steps.check.outputs.update_needed == 'true'
        run: |
          if [[ -z "${{ steps.check.outputs.new_version }}" ]]; then
            echo "::error::New version is empty"
            exit 1
          fi

          if [[ -z "${{ steps.check.outputs.new_sha256 }}" ]]; then
            echo "::error::SHA256 is empty"
            exit 1
          fi

          echo "::notice::All outputs validated successfully"

      - name: Commit and push
        if: steps.check.outputs.update_needed == 'true'
        uses: ./.github/actions/commit-update
        with:
          cask_name: adobe-downloader
          display_name: "Adobe Downloader"
          new_version: ${{ steps.check.outputs.new_version }}
          old_version: ${{ steps.check.outputs.old_version }}
          new_sha256: ${{ steps.check.outputs.new_sha256 }}
          download_url: "https://github.com/X1a0He/Adobe-Downloader/releases/latest"

      # 最终状态报告
      - name: Final status report
        if: always()
        uses: ./.github/actions/final-report
        with:
          job_status: ${{ job.status }}
          update_needed: ${{ steps.check.outputs.update_needed }}
          old_version: ${{ steps.check.outputs.old_version }}
          new_version: ${{ steps.check.outputs.new_version }}
          workflow_name: "Update Adobe Downloader Cask"
