name: Update Adobe Downloader Cask

on:
  schedule:
    - cron: "36 23 */3 * *" # 每月 1、4、7...号检查一次
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cask-update
  queue: max
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check new version
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/X1a0He/Adobe-Downloader/releases/latest"
          CURRENT_VERSION=$(sed -n 's/^  version \"\(.*\)\"/\1/p' Casks/adobe-downloader.rb)

          echo "::group::Checking for new version"
          echo "Current version: $CURRENT_VERSION"

          curl_headers=(-H "Accept: application/vnd.github+json")
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            curl_headers+=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          fi
          json=$(curl -fsSL "${curl_headers[@]}" "$API")
          TAG=$(printf "%s" "$json" | jq -r '.tag_name // empty')

          if [[ -z "${TAG:-}" ]]; then
            echo "::error::Failed to parse latest GitHub tag."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::Invalid version tag format: $TAG"
            exit 1
          fi

          echo "Latest tag: $TAG"

          if [[ "$TAG" == "$CURRENT_VERSION" ]]; then
            echo "::notice::Already at latest version: $CURRENT_VERSION"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$(printf '%s\n' "$CURRENT_VERSION" "$TAG" | sort -V | tail -n1)" != "$TAG" ]]; then
            echo "::notice::Latest tag ${TAG} is not newer than ${CURRENT_VERSION}; leaving unchanged."
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::New version available: $TAG"
          echo "::endgroup::"

          URL="https://github.com/X1a0He/Adobe-Downloader/releases/download/${TAG}/Adobe.Downloader.dmg"

          echo "new_version=$TAG" >> "$GITHUB_OUTPUT"
          echo "old_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          echo "update_needed=true" >> "$GITHUB_OUTPUT"

      - name: Download and verify
        id: download
        if: steps.check.outputs.update_needed == 'true'
        uses: ./.github/actions/download-verify
        with:
          url: ${{ steps.check.outputs.download_url }}
          output_path: /tmp/cask-downloads/adobe-downloader.dmg
          min_size: "3000000"

      - name: Commit and push
        if: steps.check.outputs.update_needed == 'true'
        uses: ./.github/actions/commit-update
        with:
          cask_name: adobe-downloader
          display_name: "Adobe Downloader"
          new_version: ${{ steps.check.outputs.new_version }}
          old_version: ${{ steps.check.outputs.old_version }}
          new_sha256: ${{ steps.download.outputs.sha256 }}
          download_url: "https://github.com/X1a0He/Adobe-Downloader/releases/tag/${{ steps.check.outputs.new_version }}"

      # 最终状态报告
      - name: Final status report
        if: always()
        uses: ./.github/actions/final-report
        with:
          job_status: ${{ job.status }}
          update_needed: ${{ steps.check.outputs.update_needed }}
          old_version: ${{ steps.check.outputs.old_version }}
          new_version: ${{ steps.check.outputs.new_version }}
          workflow_name: "Update Adobe Downloader Cask"
