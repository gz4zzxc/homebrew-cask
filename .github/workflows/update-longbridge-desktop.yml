name: Update Longbridge Desktop Cask

on:
  schedule:
    - cron: "28 1 */3 * *" # 每月 1、4、7...号检查一次
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cask-update
  queue: max
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check new version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/longbridge-desktop.rb)

          echo "::group::Checking for new version"
          echo "Current version: $CURRENT_VERSION"

          manifest=$(curl -fsSL 'https://assets.lbkrs.com/github/release/longbridge-desktop/stable/latest.json') || manifest=""
          if [[ -z "${manifest:-}" ]]; then
            echo "::error::Failed to fetch Longbridge Desktop release manifest."
            exit 1
          fi

          # Trust only what the vendor manifest declares: version, asset URLs,
          # and asset SHA256 checksums. Never reconstruct URLs or blindly
          # trust the checksum of whatever was downloaded.
          NEW_VERSION=$(printf "%s" "$manifest" | jq -r '.version // empty')
          ARM_URL=$(printf "%s" "$manifest" | jq -r '.assets[] | select(.name | endswith("macos-aarch64.dmg")) | .url // empty' | head -n1)
          ARM_EXPECTED_SHA=$(printf "%s" "$manifest" | jq -r '.assets[] | select(.name | endswith("macos-aarch64.dmg")) | .sha256 // empty' | head -n1)
          INTEL_URL=$(printf "%s" "$manifest" | jq -r '.assets[] | select(.name | endswith("macos-x86_64.dmg")) | .url // empty' | head -n1)
          INTEL_EXPECTED_SHA=$(printf "%s" "$manifest" | jq -r '.assets[] | select(.name | endswith("macos-x86_64.dmg")) | .sha256 // empty' | head -n1)
          ARM_ASSET_NAME=$(printf "%s" "$manifest" | jq -r '.assets[] | select(.name | endswith("macos-aarch64.dmg")) | .name // empty' | head -n1)
          # 1.2.0+ asset names carry a git build hash: longbridge-v<version>-g<sha>-macos-<arch>.dmg
          NEW_BUILD=$(printf "%s" "$ARM_ASSET_NAME" | sed -n 's/^longbridge-v.*-g\([0-9a-f]\{7,\}\)-macos-aarch64\.dmg$/\1/p')

          if [[ -z "${NEW_VERSION:-}" || ! "$NEW_VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::Failed to parse Longbridge Desktop version."
            exit 1
          fi
          if [[ ! "${NEW_BUILD:-}" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Manifest macOS asset has no -g<sha> build suffix; manual update required."
            echo "::error::manifest arm: $ARM_ASSET_NAME"
            exit 1
          fi
          if [[ -z "${ARM_URL:-}" || ! "${ARM_EXPECTED_SHA:-}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Manifest has no usable macos-aarch64.dmg asset (url/sha256)."
            exit 1
          fi
          if [[ -z "${INTEL_URL:-}" || ! "${INTEL_EXPECTED_SHA:-}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Manifest has no usable macos-x86_64.dmg asset (url/sha256)."
            exit 1
          fi

          # Contract guard: the Cask `url` stanza is a fixed template that
          # automation never rewrites (commit-update only bumps version/sha256).
          # If upstream renames its assets, stop instead of committing a
          # version whose Cask URL would 404 on `brew upgrade`.
          # The build hash is the second CSV component of the Cask `version`.
          # NOTE: keep these two lines in sync with Casks/longbridge-desktop.rb.
          EXPECTED_ARM_URL="https://assets.lbkrs.com/github/release/longbridge-desktop/stable/longbridge-v${NEW_VERSION}-g${NEW_BUILD}-macos-aarch64.dmg"
          EXPECTED_INTEL_URL="https://assets.lbkrs.com/github/release/longbridge-desktop/stable/longbridge-v${NEW_VERSION}-g${NEW_BUILD}-macos-x86_64.dmg"
          if [[ "$ARM_URL" != "$EXPECTED_ARM_URL" || "$INTEL_URL" != "$EXPECTED_INTEL_URL" ]]; then
            echo "::error::Manifest asset URL no longer matches the Cask URL template; manual update required."
            echo "::error::manifest arm:   $ARM_URL"
            echo "::error::manifest intel: $INTEL_URL"
            exit 1
          fi

          NEW_CASK_VERSION="${NEW_VERSION},g${NEW_BUILD}"
          echo "Latest version: $NEW_VERSION (build g$NEW_BUILD)"

          if [[ "$NEW_CASK_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "::notice::Already at latest version: $CURRENT_VERSION"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::New version available: $NEW_CASK_VERSION"
          echo "::endgroup::"

          echo "new_version=$NEW_CASK_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version_display=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "old_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "arm_url=$ARM_URL" >> "$GITHUB_OUTPUT"
          echo "arm_expected_sha=$ARM_EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "intel_url=$INTEL_URL" >> "$GITHUB_OUTPUT"
          echo "intel_expected_sha=$INTEL_EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "update_needed=true" >> "$GITHUB_OUTPUT"

      - name: Download and verify ARM64
        id: download_arm
        if: steps.check.outputs.update_needed == 'true'
        uses: ./.github/actions/download-verify
        with:
          url: ${{ steps.check.outputs.arm_url }}
          output_path: /tmp/cask-downloads/longbridge-desktop-${{ steps.check.outputs.new_version_display }}-mac-arm64.dmg
          min_size: "30000000"
          expected_sha256: ${{ steps.check.outputs.arm_expected_sha }}

      - name: Download and verify Intel
        id: download_intel
        if: steps.check.outputs.update_needed == 'true'
        uses: ./.github/actions/download-verify
        with:
          url: ${{ steps.check.outputs.intel_url }}
          output_path: /tmp/cask-downloads/longbridge-desktop-${{ steps.check.outputs.new_version_display }}-mac-x64.dmg
          min_size: "30000000"
          expected_sha256: ${{ steps.check.outputs.intel_expected_sha }}

      - name: Commit and push
        if: steps.check.outputs.update_needed == 'true'
        uses: ./.github/actions/commit-update
        with:
          cask_name: longbridge-desktop
          display_name: "Longbridge Desktop"
          new_version: ${{ steps.check.outputs.new_version }}
          new_version_display: ${{ steps.check.outputs.new_version_display }}
          old_version: ${{ steps.check.outputs.old_version }}
          new_sha256_intel: ${{ steps.download_intel.outputs.sha256 }}
          new_sha256_arm: ${{ steps.download_arm.outputs.sha256 }}
          download_url: "https://assets.lbkrs.com/github/release/longbridge-desktop/stable/latest.json"

      - name: Final status report
        if: always()
        uses: ./.github/actions/final-report
        with:
          job_status: ${{ job.status }}
          update_needed: ${{ steps.check.outputs.update_needed }}
          old_version: ${{ steps.check.outputs.old_version }}
          new_version: ${{ steps.check.outputs.new_version }}
          workflow_name: "Update Longbridge Desktop Cask"
