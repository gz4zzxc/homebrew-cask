name: Update Eudic Cask

on:
  schedule:
    - cron: "24 23 */3 * *" # 每月 1、4、7...号检查一次
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cask-update
  queue: max
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check new version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          FEED_URL="https://static.eudic.net/pkg/eudic_mac.xml"

          CURRENT_VERSION=$(sed -n 's/^  version \"\(.*\)\"/\1/p' Casks/eudic.rb)

          echo "::group::Checking for new version"
          echo "Current version: $CURRENT_VERSION"

          feed=$(curl -fsSL "$FEED_URL")
          SHORT=$(printf "%s" "$feed" | sed -nE 's/.*sparkle:shortVersionString="([^"]+)".*/\1/p' | head -n1)
          BUILD=$(printf "%s" "$feed" | sed -nE 's/.*sparkle:version="([^"]+)".*/\1/p' | head -n1)

          if [[ -z "${SHORT:-}" || -z "${BUILD:-}" ]]; then
            echo "::error::Failed to parse Eudic version."
            exit 1
          fi

          if [[ ! "$SHORT" =~ ^[0-9]+(\.[0-9]+)+$ || ! "$BUILD" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid Eudic version format (Short: $SHORT, Build: $BUILD)."
            exit 1
          fi

          NEW_VERSION="$SHORT,$BUILD"
          echo "Latest version: $NEW_VERSION (Short: $SHORT, Build: $BUILD)"

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "::notice::Already at latest version: $CURRENT_VERSION"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::New version available: $NEW_VERSION"
          echo "::endgroup::"

          URL="https://static.eudic.net/pkg/eudicmac.dmg?v=${BUILD}"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version_display=$SHORT" >> "$GITHUB_OUTPUT"
          echo "old_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          echo "update_needed=true" >> "$GITHUB_OUTPUT"

      - name: Download and verify
        id: download
        if: steps.check.outputs.update_needed == 'true'
        uses: ./.github/actions/download-verify
        with:
          url: ${{ steps.check.outputs.download_url }}
          output_path: /tmp/cask-downloads/eudic.dmg
          min_size: "10000000"

      - name: Commit and push
        if: steps.check.outputs.update_needed == 'true'
        uses: ./.github/actions/commit-update
        with:
          cask_name: eudic
          display_name: "Eudic"
          new_version: ${{ steps.check.outputs.new_version }}
          old_version: ${{ steps.check.outputs.old_version }}
          new_sha256: ${{ steps.download.outputs.sha256 }}
          new_version_display: ${{ steps.check.outputs.new_version_display }}
          download_url: "https://static.eudic.net/pkg/eudic_mac.xml"

      # 最终状态报告
      - name: Final status report
        if: always()
        uses: ./.github/actions/final-report
        with:
          job_status: ${{ job.status }}
          update_needed: ${{ steps.check.outputs.update_needed }}
          old_version: ${{ steps.check.outputs.old_version }}
          new_version: ${{ steps.check.outputs.new_version }}
          workflow_name: "Update Eudic Cask"
