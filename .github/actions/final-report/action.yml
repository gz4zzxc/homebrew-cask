name: 'Final Report'
description: 'Reports the final status of the workflow and cleans up'
inputs:
  job_status:
    description: 'Status of the job'
    required: true
  update_needed:
    description: 'Whether an update was needed'
    required: true
  old_version:
    description: 'Old version string'
    required: false
  new_version:
    description: 'New version string'
    required: false
  workflow_name:
    description: 'Name of the workflow'
    required: true

runs:
  using: "composite"
  steps:
    - name: Final status report
      if: always()
      shell: bash
      env:
        WORKFLOW_NAME: ${{ inputs.workflow_name }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        JOB_STATUS: ${{ inputs.job_status }}
        UPDATE_NEEDED: ${{ inputs.update_needed }}
        OLD_VERSION: ${{ inputs.old_version }}
        NEW_VERSION: ${{ inputs.new_version }}
      run: |
        echo "::group::Final Status Report"
        echo "Workflow: $WORKFLOW_NAME"
        echo "Run ID: $RUN_ID"
        echo "Run Attempt: $RUN_ATTEMPT"
        echo "Status: $JOB_STATUS"

        if [[ "$UPDATE_NEEDED" == "true" ]]; then
          echo "Update: Required and processed"
          echo "Old Version: $OLD_VERSION"
          echo "New Version: $NEW_VERSION"
        else
          echo "Update: Not required or failed"
        fi

        echo "::endgroup::"
